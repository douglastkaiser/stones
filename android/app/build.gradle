plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def androidUploadStoreFile = System.getenv("ANDROID_UPLOAD_STORE_FILE")
def androidUploadStorePassword = System.getenv("ANDROID_UPLOAD_STORE_PASSWORD")
def androidUploadKeyAlias = System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
def androidUploadKeyPassword = System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
def isReleaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

if (isReleaseTaskRequested && (!androidUploadStoreFile || !androidUploadStorePassword || !androidUploadKeyAlias || !androidUploadKeyPassword)) {
    throw new GradleException("Missing Android upload keystore configuration for release build.")
}

android {
    namespace = "com.douglastkaiser.stones"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.douglastkaiser.stones"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        resValue "string", "play_games_app_id", System.getenv("STONES_PLAY_GAMES_APP_ID") ?: "0"
    }

    // Flutter owns ABI splitting through --split-per-abi. Gradle-level splits
    // previously also affected debug builds and conflicted with bundle tasks.
    signingConfigs {
        release {
            if (androidUploadStoreFile) {
                storeFile file(androidUploadStoreFile)
            }
            storePassword androidUploadStorePassword ?: ""
            keyAlias androidUploadKeyAlias ?: ""
            keyPassword androidUploadKeyPassword ?: ""
        }
    }

    buildTypes {
        debug {
            // Keep existing debug config; use default debug keystore.
        }
        release {
            signingConfig signingConfigs.release
            // Enable code shrinking and resource optimization for smaller APK
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Profile-prompt suppression requires v21+, above the plugin's v20 default.
    implementation "com.google.android.gms:play-services-games-v2:21.0.0"
}
