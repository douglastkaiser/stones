name: stones
description: A two-player abstract strategy game inspired by classic connection and stacking games.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.2.1
  web: ^1.0.0
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  google_fonts: ^6.1.0
  url_launcher: ^6.2.1
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.2
  games_services: ^4.1.1
  firebase_core: ^3.5.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.0
  firebase_app_check: ^0.3.1+3
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  share_plus: ^12.0.2
  wakelock_plus: ^1.5.2

dev_dependencies:
  shared_preferences_platform_interface: ^2.4.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  fonts:
    - family: StonesSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: StonesLora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
  assets:
    - assets/fonts/Lora-OFL.txt
    - assets/fonts/Roboto-OFL.txt
    - assets/icon/
    - assets/splash/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false  # Enable when iOS project is scaffolded with: flutter create . --platforms=ios
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#EDE5D7"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  # The source already includes the Android circular safe-area padding.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  web:
    generate: false
    image_path: "assets/icon/app_icon.png"
    background_color: "#EDE5D7"
    theme_color: "#EDE5D7"
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#EDE5D7"
  color_dark: "#1B1816"
  image: "assets/splash/mark.png"
  image_dark: "assets/splash/mark_dark.png"
  # The custom accessible loader is maintained in web/index.html.
  web: false
  android_12:
    color: "#EDE5D7"
    color_dark: "#1B1816"
    image: "assets/splash/android12.png"
    image_dark: "assets/splash/android12_dark.png"
