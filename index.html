  <script>
    // SharedPreferences' legacy web backend stores JSON under flutter.<key>.
    // This runs synchronously in head, before the loader or Flutter can paint.
    (() => {
      let preference = 0;
      try {
        const raw = localStorage.getItem('flutter.theme_mode');
        const saved = JSON.parse(raw);
        if (Number.isInteger(saved) && saved >= 0 && saved <= 2 && raw.trim() === String(saved)) preference = saved;
      } catch (_) { /* Restricted storage uses system appearance. */ }
      const system = window.matchMedia('(prefers-color-scheme: dark)');
      const apply = () => {
        const dark = preference === 2 || (preference === 0 && system.matches);
        document.documentElement.dataset.appearance = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#1B1816' : '#EDE5D7';
      };
      apply();
      system.addEventListener('change', apply);
    })();
  </script>

<body>
  <div class="loading-container" id="stones-loader">
    <div class="loading-content">
      <svg class="stones-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <rect x="32" y="16" width="36" height="16" fill="var(--foreground)"/>
        <rect x="24" y="40" width="52" height="16" fill="var(--accent)"/>
        <rect x="16" y="64" width="68" height="16" fill="var(--foreground)"/>
      </svg>
      <h1 class="wordmark">STONES</h1>
      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-text" role="status" aria-live="polite" aria-atomic="true">Loading Stones…</p>
      <p class="loading-help" id="startup-help" hidden>Startup is taking longer than usual. Check your connection, keep waiting, or reload to try again.</p>
      <button id="startup-reload" type="button" hidden>Reload</button>
      <noscript><p>Enable JavaScript to play Stones.</p></noscript>
    </div>
  </div>
  <script>
    (() => {
      const loader = document.getElementById('stones-loader');
      const status = loader.querySelector('.loading-text');
      const reload = document.getElementById('startup-reload');
      let ready = false;
      let failed = false;
      reload.addEventListener('click', () => window.location.reload());
      const slow = setTimeout(() => {
        document.getElementById('startup-help').hidden = false;
        reload.hidden = false;
        status.textContent = 'Still loading Stones…';
      }, 15000);
      window.stonesStartup = {
        fail() {
          if (ready || failed) return;
          failed = true;
          clearTimeout(slow);
          status.textContent = 'Stones could not start. Reload to try again.';
          loader.querySelector('.loading-spinner').hidden = true;
          reload.hidden = false;
        }
      };
      window.addEventListener('error', event => {
        const src = event.target?.src || event.filename || '';
        if (/flutter_bootstrap|\.dart\.js|canvaskit|skwasm/.test(src)) window.stonesStartup.fail();
      }, true);
      // Flutter dispatches this after rasterizing its initialized first frame.
      // runApp() completing alone is not evidence that the interface is visible.
      window.addEventListener('flutter-first-frame', () => {
        ready = true;
        clearTimeout(slow);
        requestAnimationFrame(() => {
          document.body.classList.add('loaded');
          loader.setAttribute('aria-hidden', 'true');
          loader.inert = true;
          setTimeout(() => loader.remove(), 180);
        });
      }, { once: true });
    })();
  </script>

    }
