name: CI

on:
  push:
    branches:
      - '**'
      - '!gh-pages'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version generation

      - name: Generate version info
        run: ./scripts/generate_version.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting without changing source
        run: python3 scripts/check_format.py
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Test release tools
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Generate splash branding
        run: ./scripts/generate_splash_branding.sh

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Run analyzer
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Save coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/lcov.info

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version generation

      - name: Generate version info
        run: ./scripts/generate_version.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Generate splash branding
        run: ./scripts/generate_splash_branding.sh

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Build web
        run: flutter build web --release --base-href "/stones/"
      - name: Fingerprint web startup assets
        run: |
          python3 -m unittest scripts.test_prepare_web_release
          python3 scripts/prepare_web_release.py
          python3 scripts/web_artifact.py create build/web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: build/web
          include-hidden-files: true
          retention-days: 14

  build-android:
    name: Compile Android
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 -m unittest discover -s scripts -p 'test_android_release_preflight.py'
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: stones-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  browser-journeys:
    name: Browser player journeys
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter pub get
      - name: Build a separate emulator-only application
        run: flutter build web --release --target tools/integration_app.dart --base-href /stones/ --output build/integration-web --no-web-resources-cdn
      - name: Install browser harness
        run: |
          pip install playwright==1.62.0
          playwright install --with-deps chromium
      - name: Exercise learning, saved games and independent friend clients
        run: npx --yes firebase-tools@15.33.0 emulators:exec --only auth,firestore --project demo-stones-hex 'python3 tools/browser_journeys.py && python3 tools/google_auth_browser_checks.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-journeys-${{ github.sha }}
          path: |
            build/qa/journeys
            build/qa/google-auth
          if-no-files-found: warn
