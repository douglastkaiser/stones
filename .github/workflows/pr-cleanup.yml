name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: stones-gh-pages-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Remove only this preview
        env:
          PREVIEW: ${{ github.event.pull_request.number }}
        run: |
          git -C published pull --ff-only origin gh-pages
          python3 scripts/publish_web.py --target published --preview "$PREVIEW"
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C published add -A
          git -C published diff --staged --quiet || git -C published commit -m 'Remove closed PR preview [skip ci]'
          git -C published push origin HEAD:gh-pages
