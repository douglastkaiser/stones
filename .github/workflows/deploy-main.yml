name: Deploy Main

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Qualified main commit; blank selects current main'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.qualification.outputs.source }}
      run: ${{ steps.qualification.outputs.run }}
      artifact: ${{ steps.qualification.outputs.artifact }}
    steps:
      - name: Require successful CI and rules for the selected main commit
        id: qualification
        uses: actions/github-script@v7
        env:
          SELECTED_SOURCE: ${{ inputs.source_sha }}
        with:
          script: |
            const repo = {...context.repo};
            const main = (await github.rest.repos.getBranch({...repo, branch: 'main'})).data.commit.sha;
            const source = process.env.SELECTED_SOURCE || main;
            if (!/^[a-f0-9]{40}$/.test(source)) throw new Error('Use a full commit SHA');
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({
              ...repo, basehead: `${source}...${main}`
            })).data;
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('Selected commit must belong to main history');
            }
            for (const workflow_id of ['ci.yml', 'firestore-rules.yml']) {
              const runs = (await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id, branch: 'main', event: 'push', head_sha: source,
                per_page: 100
              })).data.workflow_runs;
              const run = runs[0];
              if (!run || run.status !== 'completed' || run.conclusion !== 'success' ||
                  run.head_sha !== source || run.head_repository.full_name !== `${repo.owner}/${repo.repo}`) {
                throw new Error(`${workflow_id} has not qualified ${source}`);
              }
              if (workflow_id === 'ci.yml') {
                if (run.run_attempt < 2) throw new Error('Require two consecutive successful CI attempts');
                for (const attempt_number of [run.run_attempt - 1, run.run_attempt]) {
                  const attempt = (await github.rest.actions.getWorkflowRunAttempt({
                    ...repo, run_id: run.id, attempt_number
                  })).data;
                  if (attempt.status !== 'completed' || attempt.conclusion !== 'success') {
                    throw new Error(`CI attempt ${attempt_number} has not qualified ${source}`);
                  }
                }
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...repo, run_id: run.id, filter: 'latest', per_page: 100
                });
                const required = ['Browser player journeys',
                  ...['square', 'hex'].flatMap(shape => [0, 1, 2].map(tier =>
                    `AI ordering (${shape}, ${tier})`)),
                  ...['chromium', 'firefox', 'webkit'].flatMap(browser => [
                    `Account checks (${browser})`, `Production auth recovery (${browser})`
                  ])];
                for (const name of required) {
                  if (!jobs.some(job => job.name === name && job.conclusion === 'success')) {
                    throw new Error(`Missing successful qualification job: ${name}`);
                  }
                }
                core.setOutput('run', String(run.id));
                core.setOutput('artifact', `web-build-${source}-${run.run_attempt}`);
              }
            }
            core.setOutput('source', source);

  publish:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: stones-gh-pages-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify.outputs.source }}
          fetch-depth: 0
      - name: Check out the release tools belonging to this workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.qualify.outputs.artifact }}
          run-id: ${{ needs.qualify.outputs.run }}
          github-token: ${{ github.token }}
          path: build/web
      - name: Verify the qualified artifact
        run: python3 scripts/web_artifact.py verify build/web --source "$SOURCE" --kind production
        env:
          SOURCE: ${{ needs.qualify.outputs.source }}
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Preserve and verify the previous release before publication
        run: |
          git -C published pull --ff-only origin gh-pages
          git -C published rev-parse HEAD > rollback-publishing-commit.txt
          python3 scripts/rollback_artifact.py published build/rollback > rollback-source.json
          python3 release-tools/scripts/web_artifact.py verify build/rollback --backend-from-git --source "$(python3 -c 'import json; print(json.load(open("rollback-source.json"))["previous_source"])')"
      - uses: actions/upload-artifact@v4
        with:
          name: rollback-${{ needs.qualify.outputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/rollback
            rollback-source.json
            rollback-publishing-commit.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Publish the verified build while preserving previews and cached startup
        run: |
          git -C published pull --ff-only origin gh-pages
          python3 scripts/publish_web.py --source build/web --target published
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C published add -A
          git -C published diff --staged --quiet || git -C published commit -m 'Publish qualified main artifact [skip ci]'
          git -C published push origin HEAD:gh-pages
      - name: Record publication evidence
        run: |
          echo "Published source: $SOURCE" >> "$GITHUB_STEP_SUMMARY"
          echo "Qualified CI run: $RUN" >> "$GITHUB_STEP_SUMMARY"
          echo 'Publication completed; hosted verification is a separate required job. Rollback artifact retained for 90 days. Physical iOS and real Google exchange remain pending.' >> "$GITHUB_STEP_SUMMARY"
        env:
          SOURCE: ${{ needs.qualify.outputs.source }}
          RUN: ${{ needs.qualify.outputs.run }}

  verify-hosted:
    name: Verify hosted login (${{ matrix.browser }})
    needs: [qualify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify.outputs.source }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser harness
        timeout-minutes: 5
        run: bash scripts/install_browser_harness.sh ${{ matrix.browser }}
      - name: Verify selected hosted source, integrity and Google handoff
        run: python3 tools/hosted_auth_check.py --expected-source "$SOURCE" --wait-seconds 300 --browsers ${{ matrix.browser }}
        env:
          SOURCE: ${{ needs.qualify.outputs.source }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-${{ matrix.browser }}-${{ needs.qualify.outputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qa/hosted-auth
          if-no-files-found: warn
      - name: Record hosted verification
        if: always()
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          report = Path('build/qa/hosted-auth/summary.json')
          data = json.loads(report.read_text()) if report.exists() else {'status': 'not_run'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
              target.write('Hosted verification: ' + data['status'] + '\n')
              target.write('Physical iOS and real Google credential exchange remain unverified.\n')
          PYREPORT
