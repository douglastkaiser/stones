name: Android Release

on:
  workflow_dispatch:
    inputs:
      include_appbundle:
        description: 'Build the Play Store AAB as well as installable APKs'
        default: true
        type: boolean
      build_number:
        description: 'Optional version code, greater than the version already in Play Console'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  android-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STONES_PLAY_GAMES_APP_ID: ${{ vars.STONES_PLAY_GAMES_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true
      - name: Generate and validate version
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          ./scripts/generate_version.sh
          code="${REQUESTED_BUILD_NUMBER:-$(git rev-list --count HEAD)}"
          if [[ ! "$code" =~ ^[1-9][0-9]{0,9}$ ]] || (( code > 2100000000 )); then
            echo '::error::Build number must be a positive Android version code no greater than 2100000000'
            exit 1
          fi
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$code-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo '::error::ANDROID_UPLOAD_KEYSTORE_B64 is missing'; exit 1; }
          export ANDROID_UPLOAD_STORE_FILE="$RUNNER_TEMP/stones-upload.jks"
          echo "ANDROID_UPLOAD_STORE_FILE=$ANDROID_UPLOAD_STORE_FILE" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_UPLOAD_STORE_FILE"
          chmod 600 "$ANDROID_UPLOAD_STORE_FILE"
      - name: Validate signing and Firebase configuration
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: python3 scripts/android_release_preflight.py
      - run: flutter pub get
      - name: Generate branding
        run: |
          dart run flutter_launcher_icons
          ./scripts/generate_splash_branding.sh
          dart run flutter_native_splash:create
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Prepare optional Play Games resource IDs
        env:
          PLAY_GAMES_IDS_JSON: ${{ vars.PLAY_GAMES_IDS_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          ids = json.loads(os.environ.get('PLAY_GAMES_IDS_JSON') or '{}')
          allowed = {'PLAY_GAMES_ACHIEVEMENT_' + name for name in
                     ['FIRST_WIN', 'ROAD_BUILDER', 'FLAT_EARTH', 'GIANT_SLAYER', 'SPEED_DEMON', 'CAPSTONE_MASTER']}
          allowed |= {'PLAY_GAMES_LEADERBOARD_' + name for name in ['TOTAL_WINS', 'LONGEST_STREAK', 'FASTEST_WIN']}
          if not isinstance(ids, dict) or any(key not in allowed or not isinstance(value, str) for key, value in ids.items()):
              raise SystemExit('PLAY_GAMES_IDS_JSON must contain only the documented resource ID strings')
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/play-games-defines.json').write_text(json.dumps(ids))
          PY
      - name: Build installable APKs and optional Play bundle
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          INCLUDE_APPBUNDLE: ${{ inputs.include_appbundle }}
        run: |
          export ANDROID_UPLOAD_KEY_ALIAS="$STONES_RESOLVED_UPLOAD_KEY_ALIAS"
          pgs=false
          if [[ -n "$STONES_PLAY_GAMES_APP_ID" ]]; then pgs=true; fi
          args=(--release --build-number="$VERSION_CODE" --build-name="$VERSION_NAME" --dart-define="STONES_PLAY_GAMES_ENABLED=$pgs" --dart-define-from-file=build/play-games-defines.json)
          flutter build apk "${args[@]}"
          flutter build apk "${args[@]}" --split-per-abi
          if [[ "$INCLUDE_APPBUNDLE" == true ]]; then flutter build appbundle "${args[@]}"; fi
      - name: Verify APK signatures and publish release report
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          mkdir -p build/android-release-report
          for apk in build/app/outputs/flutter-apk/app*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk"
            sha256sum "$apk" >> build/android-release-report/SHA256SUMS.txt
          done
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('build/android-release-report/release.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'version_name': os.environ['VERSION_NAME'],
              'version_code': int(os.environ['VERSION_CODE']), 'flutter': '3.47.7',
              'package': 'com.douglastkaiser.stones',
              'play_games_enabled': bool(os.environ.get('STONES_PLAY_GAMES_APP_ID'))}, indent=2))
          PY
          {
            echo "## Stones Android $VERSION_NAME ($VERSION_CODE)"
            echo "Commit: $GITHUB_SHA"
            echo 'Download the APK artifact and unzip it. Use app-release.apk on any supported Android device, or app-arm64-v8a-release.apk for most modern phones.'
            echo 'AAB is for Play Console upload; it cannot be installed directly. Play-distributed installs use the Play app-signing certificate, not the upload certificate.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stones-android-apks-${{ env.RELEASE_ID }}
          path: build/app/outputs/flutter-apk/app*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: inputs.include_appbundle
        with:
          name: stones-play-bundle-${{ env.RELEASE_ID }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: stones-android-report-${{ env.RELEASE_ID }}
          path: build/android-release-report/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: |
          if [[ -n "${ANDROID_UPLOAD_STORE_FILE:-}" ]]; then rm -f "$ANDROID_UPLOAD_STORE_FILE"; fi
