name: Finishing Preview

on:
  workflow_dispatch:
  push:
    branches: ['codex/finishing-*']
    paths:
      - 'lib/design_preview.dart'
      - 'lib/theme/tavern_theme.dart'
      - 'assets/fonts/**'
      - 'test/design_preview_test.dart'
      - 'tools/shared_performance_probe_test.dart'
      - '.github/workflows/finishing-preview.yml'

permissions:
  contents: write

concurrency:
  group: finishing-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 -m unittest scripts.test_release_baseline
      - name: Format candidate sources
        run: |
          mkdir -p build/qa/finishing
          dart format lib/design_preview.dart lib/theme/tavern_theme.dart test/design_preview_test.dart tools/shared_performance_probe_test.dart
          git diff --binary -- lib/design_preview.dart lib/theme/tavern_theme.dart test/design_preview_test.dart tools/shared_performance_probe_test.dart > build/qa/finishing/format.patch
      - run: flutter analyze --fatal-infos
      - name: Test layouts and capture review views
        run: flutter test test/design_preview_test.dart --dart-define=STONES_CAPTURE_PREVIEW=true --reporter expanded
      - name: Measure shared AI workloads on this runner
        run: flutter test tools/shared_performance_probe_test.dart --reporter expanded | tee build/qa/finishing/shared-performance.log
      - name: Build isolated preview
        run: |
          ./scripts/generate_version.sh
          flutter build web --release --target lib/design_preview.dart --base-href /stones/pr/finishing/
          python3 scripts/prepare_web_release.py
          python3 scripts/release_baseline.py --output build/qa/finishing/source-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finishing-review-${{ github.sha }}
          path: build/qa/finishing/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: finishing-preview-${{ github.sha }}
          path: build/web/
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Publish only the isolated preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          target = Path('published/pr/finishing')
          if target.is_dir():
              shutil.rmtree(target)
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree('build/web', target)
          PY
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pr/finishing
          git diff --staged --quiet || git commit -m 'Publish finishing design preview [skip ci]'
          git pull --rebase origin gh-pages
          git push origin gh-pages
      - name: Review location
        run: echo 'Preview https://www.douglastkaiser.com/stones/pr/finishing/' >> "$GITHUB_STEP_SUMMARY"
