name: Finishing Preview

on:
  workflow_dispatch:
  push:
    branches: ['codex/finishing-*']
    paths:
      - 'lib/**'
      - 'lib/theme/tavern_theme.dart'
      - 'assets/fonts/**'
      - 'test/design_preview_test.dart'
      - 'test/game/first_game_flow_test.dart'
      - 'test/game/match_screen_test.dart'
      - 'test/widgets/play_selector_test.dart'
      - 'android/app/src/main/**'
      - 'tools/shared_performance_probe_test.dart'
      - '.github/workflows/finishing-preview.yml'
      - 'web/design_preview.html'
      - 'pubspec.yaml'
      - 'scripts/release_baseline.py'
      - 'scripts/test_release_baseline.py'

permissions:
  contents: read

jobs:
  preview:
    concurrency:
      group: finishing-preview-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 -m unittest scripts.test_release_baseline
      - name: Check formatting without rewriting the candidate
        run: |
          mkdir -p build/qa/finishing
          python3 scripts/check_format.py
        env:
          FORMAT_BASE: ${{ github.event.before }}
      - run: flutter analyze --fatal-infos
      - name: Test layouts and capture review views
        run: flutter test test/design_preview_test.dart test/game/first_game_flow_test.dart test/game/match_screen_test.dart test/widgets/play_selector_test.dart --dart-define=STONES_CAPTURE_PREVIEW=true --reporter expanded
      - name: Measure shared AI workloads on this runner
        shell: bash
        run: flutter test tools/shared_performance_probe_test.dart --reporter expanded | tee build/qa/finishing/shared-performance.log
      - name: Build isolated preview
        run: |
          ./scripts/generate_version.sh
          python3 - <<'PY'
          import os
          from pathlib import Path
          template = Path('web/design_preview.html').read_text(encoding='utf-8')
          Path('web/index.html').write_text(template.replace('__STONES_PREVIEW_COMMIT__', os.environ['GITHUB_SHA']), encoding='utf-8')
          PY
          flutter build web --release --target lib/design_preview.dart --base-href /stones/pr/finishing/
          python3 scripts/prepare_web_release.py
          python3 scripts/release_baseline.py --output build/qa/finishing/source-baseline.json
      - name: Build real app for isolated integration review
        run: |
          flutter build web --release --target lib/main.dart --base-href /stones/pr/finishing-game/ --output build/finishing-game
          python3 scripts/prepare_web_release.py build/finishing-game
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finishing-review-${{ github.sha }}
          path: build/qa/finishing/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: finishing-preview-${{ github.sha }}
          path: build/web/
      - uses: actions/upload-artifact@v4
        with:
          name: finishing-game-${{ github.sha }}
          path: build/finishing-game/
  publish:
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: stones-gh-pages-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: finishing-preview-${{ github.sha }}
          path: build/web
      - uses: actions/download-artifact@v4
        with:
          name: finishing-game-${{ github.sha }}
          path: build/finishing-game
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Publish isolated review builds
        run: |
          git -C published pull --ff-only origin gh-pages
          python3 scripts/publish_web.py --source build/web --target published --preview finishing
          python3 scripts/publish_web.py --source build/finishing-game --target published --preview finishing-game
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C published add pr/finishing pr/finishing-game
          git -C published diff --staged --quiet || git -C published commit -m 'Publish finishing review [skip ci]'
          git -C published push origin HEAD:gh-pages
      - name: Review location
        run: echo 'Preview https://www.douglastkaiser.com/stones/pr/finishing/' >> "$GITHUB_STEP_SUMMARY"
