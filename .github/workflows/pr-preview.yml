name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-and-deploy-preview:
    name: Build Preview
    timeout-minutes: 20
    concurrency:
      group: pr-preview-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version info
        run: ./scripts/generate_version.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Generate splash branding
        run: python3 scripts/generate_branding.py --check

      - name: Generate splash screen
        run: |
          dart run flutter_native_splash:create
          python3 scripts/check_startup_branding.py

      - name: Build web for PR preview
        run: flutter build web --release --base-href "/stones/pr/${{ github.event.pull_request.number }}/"
      - name: Fingerprint web startup assets
        run: |
          python3 -m unittest scripts.test_prepare_web_release
          python3 scripts/prepare_web_release.py

      - name: Ensure privacy.html is included
        run: |
          if [ -f "web/privacy.html" ] && [ ! -f "build/web/privacy.html" ]; then
            cp web/privacy.html build/web/
            echo "Copied privacy.html to build/web/"
          elif [ -f "build/web/privacy.html" ]; then
            echo "privacy.html already exists in build/web/"
          else
            echo "Warning: web/privacy.html not found"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: build/web
          if-no-files-found: error

  publish:
    needs: build-and-deploy-preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: stones-gh-pages-publication
      cancel-in-progress: false
    steps:
      - name: Reject a closed or superseded preview
        uses: actions/github-script@v7
        with:
          script: |
            const pr = (await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number
            })).data;
            if (pr.state !== 'open' ||
                pr.head.sha !== context.payload.pull_request.head.sha) {
              throw new Error('This preview is closed or has been superseded');
            }
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: build/web
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Publish this preview on the latest publishing branch
        env:
          PREVIEW: ${{ github.event.pull_request.number }}
        run: |
          git -C published pull --ff-only origin gh-pages
          python3 scripts/publish_web.py --source build/web --target published --preview "$PREVIEW"
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C published add -A
          git -C published diff --staged --quiet || git -C published commit -m 'Publish PR preview [skip ci]'
          git -C published push origin HEAD:gh-pages

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://${{ github.repository_owner }}.github.io/stones/pr/${prNumber}/`;
            const body = `## Preview Deployment Ready!\n\n` +
              `Your changes have been deployed to:\n\n` +
              `**[${previewUrl}](${previewUrl})**\n\n` +
              `This preview will be updated with each new commit to this PR.`;

            // Check if we already commented
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Deployment Ready')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
